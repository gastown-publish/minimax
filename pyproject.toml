[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-agent"
version = "0.2.3"
description = "MiniMax-M2.5 AI terminal agent — chat, code, and create"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "villamarket.ai"}]
keywords = ["ai", "cli", "llm", "minimax", "agent", "coding", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "click>=8.0",
    "httpx>=0.24",
    "rich>=13.0",
    "openai>=1.0",
    "dnspython>=2.4",
    "agent-client-protocol>=0.8.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://minimax.villamarket.ai"
Documentation = "https://minimax.villamarket.ai/docs"
Repository = "https://github.com/gastown-publish/minimax"
Issues = "https://github.com/gastown-publish/minimax/issues"

[project.optional-dependencies]
tui = ["textual>=0.40"]
term = ["batrachian-toad>=0.6.0"]
all = ["textual>=0.40", "batrachian-toad>=0.6.0"]

[project.scripts]
mm = "minimax_cli.main:cli"
minimax = "minimax_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["minimax_cli*"]

[tool.setuptools.package-data]
minimax_cli = ["skills/*.md"]
