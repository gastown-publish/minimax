[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-cli"
version = "0.2.0"
description = "MiniMax-M2.5 AI terminal agent — chat, code, and create"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "httpx>=0.24",
    "rich>=13.0",
    "openai>=1.0",
    "dnspython>=2.4",
    "agent-client-protocol>=0.8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tui = ["textual>=0.40"]
term = ["batrachian-toad>=0.6.0"]
all = ["textual>=0.40", "batrachian-toad>=0.6.0"]

[project.scripts]
mm = "minimax_cli.main:cli"
minimax = "minimax_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
