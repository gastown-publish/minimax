name: MiniMaxApp
options:
  bundleIdPrefix: ai.villamarket
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    ALWAYS_SEARCH_USER_PATHS: false

targets:
  MiniMaxApp:
    type: application
    platform: iOS
    sources:
      - path: MiniMaxApp
        excludes:
          - "**/.DS_Store"
    info:
      path: MiniMaxApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.villamarket.minimax
        PRODUCT_NAME: MiniMaxApp
        INFOPLIST_FILE: MiniMaxApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false

  MiniMaxAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MiniMaxAppUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: MiniMaxApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.villamarket.minimax.uitests
        PRODUCT_NAME: MiniMaxAppUITests
        GENERATE_INFOPLIST_FILE: true

schemes:
  MiniMaxApp:
    build:
      targets:
        MiniMaxApp: all
        MiniMaxAppUITests: [test]
    test:
      targets:
        - MiniMaxAppUITests
