name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version consistency
        run: |
          # The single source of truth is pyproject.toml
          # __init__.py must use importlib.metadata (not hardcode)
          if grep -q '^__version__ = "' src/minimax_cli/__init__.py; then
            echo "ERROR: __init__.py has hardcoded version!"
            echo "Use importlib.metadata.version() instead."
            exit 1
          fi
          echo "Version source: pyproject.toml only (dynamic import) ✓"

      - name: Verify wheel builds
        run: |
          pip install build
          python -m build --wheel
          VERSION=$(python -c "
          import re
          text = open('pyproject.toml').read()
          print(re.search(r'version = \"(.+?)\"', text).group(1))
          ")
          WHEEL=$(ls dist/*.whl)
          if echo "$WHEEL" | grep -q "$VERSION"; then
            echo "Wheel version matches pyproject.toml ($VERSION) ✓"
          else
            echo "ERROR: Wheel version mismatch!"
            echo "pyproject.toml: $VERSION"
            echo "Wheel: $WHEEL"
            exit 1
          fi

      - name: Install and verify
        run: |
          pip install dist/*.whl
          INSTALLED=$(python -c "from minimax_cli import __version__; print(__version__)")
          EXPECTED=$(python -c "
          import re
          text = open('pyproject.toml').read()
          print(re.search(r'version = \"(.+?)\"', text).group(1))
          ")
          if [ "$INSTALLED" = "$EXPECTED" ]; then
            echo "Installed version matches ($INSTALLED) ✓"
          else
            echo "ERROR: Installed version mismatch!"
            echo "Expected: $EXPECTED"
            echo "Got: $INSTALLED"
            exit 1
          fi

      - name: Verify mm CLI loads
        run: |
          mm --version
          mm --help

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest

      - name: Run tests
        run: |
          pytest tests/ -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-report.json
          bandit -r src/ -f screen -ll HIGH
