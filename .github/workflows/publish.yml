name: Publish Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload wheel + sdist to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.whl dist/*.tar.gz --clobber

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        id: trusted
        continue-on-error: true
      - name: Publish to PyPI (API token fallback)
        if: steps.trusted.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        id: token
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true
      - name: PyPI publish result
        run: |
          if [ "${{ steps.trusted.outcome }}" = "success" ]; then
            echo "PyPI publish succeeded (trusted publishing)"
          elif [ "${{ steps.token.outcome }}" = "success" ]; then
            echo "PyPI publish succeeded (API token)"
          else
            echo "::error::PyPI publish FAILED — both trusted publishing and API token methods failed."
            echo "::error::Fix: configure trusted publishing at https://pypi.org/manage/project/minimax-agent/settings/publishing/"
            echo "::error::Or add PYPI_API_TOKEN secret to the repo."
            echo "Users installing via 'pip install minimax-agent' will get an outdated version!"
            exit 1
          fi

  deb:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb package
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          export VERSION
          chmod +x packaging/debian/build-deb.sh
          packaging/debian/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: "*.deb"
      - name: Upload .deb to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" *.deb --clobber

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract version tag
        id: meta
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            thanakijwanavit/minimax:latest
            thanakijwanavit/minimax:${{ steps.meta.outputs.version }}
