name: Build Tool Docker Images

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 6am UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - name: claude
            file: docker/claude.Dockerfile
          - name: codex
            file: docker/codex.Dockerfile
          - name: nori
            file: docker/nori.Dockerfile
          - name: kimi
            file: docker/kimi.Dockerfile
          - name: toad
            file: docker/toad.Dockerfile
          - name: opencode
            file: docker/opencode.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push ${{ matrix.tool.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.tool.file }}
          push: true
          tags: |
            thanakijwanavit/mm-${{ matrix.tool.name }}:latest
            thanakijwanavit/mm-${{ matrix.tool.name }}:${{ github.sha }}
